name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: main

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Read the crate version
      id: crate
      run: |
        version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "katazome") | .version')
        echo "tag=v$version" >> "$GITHUB_OUTPUT"

    - name: Publish to crates.io
      run: cargo publish --locked
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    - name: Tag the published version
      env:
        TAG: ${{ steps.crate.outputs.tag }}
      run: |
        git tag "$TAG"
        git push origin "$TAG"
